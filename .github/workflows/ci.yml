name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Formatting and lint hooks live in lint.yml so they run as one job driven by
# .pre-commit-config.yaml.
jobs:
  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.10" in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CUDA-only dependencies (sgl-kernel, flashinfer) are imported lazily, so
      # the CPU-runnable portion of the suite needs torch alone. Tests that
      # require a GPU or a local checkpoint skip themselves.
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors fastapi uvicorn pydantic coverage pytest

      - name: Unit tests
        run: |
          python -m coverage run -m pytest tests/ -p no:cacheprovider

      - name: Coverage summary
        run: python -m coverage report

  build:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build --outdir dist .

      - name: Check metadata
        run: python -m twine check --strict dist/*

      # The JIT kernel path reads kernel/csrc/beam_trie.cuh and the vendored
      # headers under kernel/include/ at runtime, so a missing package-data glob
      # would only surface on a user's machine. Assert they are in the wheel.
      - name: Verify packaged data files
        run: |
          python - <<'PY'
          import glob, pathlib, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "flashrec/py.typed",
              "flashrec/kernel/csrc/beam_trie.cuh",
              "flashrec/kernel/include/ORIGIN.txt",
          ]
          missing = [n for n in required if n not in names]
          headers = [n for n in names
                     if n.startswith("flashrec/kernel/include/sgl_kernel/")]
          expected = len(list(
              pathlib.Path("python/flashrec/kernel/include/sgl_kernel").iterdir()))
          if len(headers) != expected:
              missing.append(
                  f"vendored headers: {len(headers)} in wheel, {expected} on disk")
          if missing:
              raise SystemExit("missing from wheel:\n  " + "\n  ".join(missing))
          print(f"ok: {len(names)} entries, {len(headers)} vendored headers")
          PY

      # Install the built wheel and import it from site-packages (not the source
      # tree) to prove the distribution is self-contained.
      - name: Smoke-test installed wheel
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install dist/*.whl
          cd "$(mktemp -d)"
          python - <<'PY'
          import os
          import flashrec
          from flashrec.scheduler.scheduler import BeamRecEngine  # noqa: F401
          from flashrec.kernel import beam_trie  # noqa: F401
          # server.api imports uvicorn at module scope; importing it here is what
          # proves the HTTP dependencies are declared, not just vendored in CI.
          from flashrec.server import api  # noqa: F401
          from flashrec import check_env
          d = os.path.dirname(flashrec.__file__)
          assert "site-packages" in d, d
          assert os.path.exists(os.path.join(d, "py.typed"))
          print("version:", flashrec.__version__)
          print("check_env rows:", len(check_env.collect()))
          PY
          flashrec --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
